[project]
name = "claw-engine"
version = "0.2.0"
description = "비행제어/유도법칙 설계툴 엔진 — MATLAB 없는 CLAW 설계·해석·시뮬레이션"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "scipy>=1.11",
    "control>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claw*"]

# 예제 기체 문서는 패키지 데이터다 — 폐쇄망 휠에 빠지면 예제 기체가 사라진다 (02 §5.6)
[tool.setuptools.package-data]
"claw.profile" = ["examples/*.json"]

[tool.pytest.ini_options]
testpaths = ["claw/tests"]
