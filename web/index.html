<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- eval-free 방침의 실효화 — 동일 출처 외 전부 차단 (스타일 속성만 허용).
       WS는 동일 출처('self')로 허용되며, 차단 환경에선 watchJob이 폴링 폴백 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>CLAW 설계툴</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <h1>CLAW <span class="sub">비행제어법칙 설계·해석·시뮬레이션</span></h1>
    <nav id="nav">
      <!-- 설계 파이프라인 — 왼쪽에서 오른쪽이 업무 순서다.
           구조·영역을 정하고(블록도·엔벨로프·트림), 게인을 잡고(게인·마진 맵·
           자동 설계 — 전부 선형), 그 게인을 6DOF로 판정하고(영향성), 통과한
           형상을 코드로 내고(Autocode), 그 코드가 원본과 같은지 본다(검증).
           영향성이 자동 설계 **다음**인 것이 이 배열의 요지다: 자동 설계는
           선형 네 지표만 자기 설계점에서 보므로(docs 02 §4 v0.59) 추종·과도·
           타면·권한·동시명령·회복은 영향성이 처음 재는 것이고, 그 판정을
           통과해야 코드로 내보낼 형상이 된다. -->
      <a href="#blocks" data-view="blocks">블록도</a>
      <a href="#envelope" data-view="envelope">엔벨로프</a>
      <a href="#trim" data-view="trim">트림</a>
      <a href="#gains" data-view="gains">게인</a>
      <a href="#margins" data-view="margins">마진 맵</a>
      <a href="#autodesign" data-view="autodesign">자동 설계</a>
      <a href="#influence" data-view="influence">영향성</a>
      <a href="#autocode" data-view="autocode">Autocode</a>
      <a href="#verify" data-view="verify">검증</a>
      <!-- 도구·열람 — 파이프라인의 단계가 아니라 아무 때나 여는 자리다.
           시뮬레이션은 임의 미션 하나를 돌려 보는 탐색이고(영향성이 판정에
           쓰는 격자 런과 다르다), 가상환경은 그 궤적을 3D로 보는 화면이며,
           결과는 지금까지 낸 산출물 목록이다. -->
      <a href="#sim" data-view="sim">시뮬레이션</a>
      <a href="#world" data-view="world">가상환경</a>
      <a href="#results" data-view="results">결과</a>
    </nav>
    <span id="health" class="health">…</span>
  </header>
  <main id="view"></main>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
