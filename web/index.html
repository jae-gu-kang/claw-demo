<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- eval-free 방침의 실효화 — 동일 출처 외 전부 차단 (스타일 속성만 허용).
       WS는 동일 출처('self')로 허용되며, 차단 환경에선 watchJob이 폴링 폴백 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>CLAW 설계툴</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header>
    <h1>CLAW <span class="sub">비행제어법칙 설계·해석·시뮬레이션</span></h1>
    <nav id="nav">
      <!-- 설계 파이프라인 — 왼쪽에서 오른쪽이 업무 순서다.
           구조·영역을 정하고(블록도·엔벨로프·트림), 게인을 잡고(게인·마진 맵·
           자동 설계 — 전부 선형), 미션 하나를 실제로 날려 보고(시뮬레이션),
           그 궤적을 눈으로 확인한 뒤(가상환경), 격자 전체로 판정하고(영향성),
           통과한 형상을 코드로 내고(Autocode), 그 코드가 원본과 같은지 본다(검증).
           **되먹임 고리가 있다**: 영향성이 Fail을 내면 처방이 설계변수를 다시 풀고
           (eval_result_id 승계) 게인·자동 설계로 돌아가 이 줄을 다시 탄다 — 탭 줄은
           직선이지만 실제 작업은 영향성에서 왼쪽으로 되돌아간다.
           시뮬레이션이 영향성 **앞**인 것이 이 배열의 요지다(v0.66): 격자 판정을
           돌리기 전에 미션 하나가 실제로 날아가는지부터 보는 것이 작업 순서고,
           그 런은 영향성 수동 진단으로 그대로 인계된다(시뮬 탭의 [영향성에서 진단]).
           영향성이 자동 설계 뒤인 근거는 그대로다 — 자동 설계는 선형 네 지표만
           자기 설계점에서 보므로(docs 04 §6) 추종·과도·타면·권한·동시명령·
           회복은 영향성이 처음 **판정**하고, 그 판정을 통과해야 코드로 낼 형상이 된다. -->
      <a href="#blocks" data-view="blocks">블록도</a>
      <a href="#envelope" data-view="envelope">엔벨로프</a>
      <a href="#trim" data-view="trim">트림</a>
      <a href="#gains" data-view="gains">게인</a>
      <a href="#margins" data-view="margins">마진 맵</a>
      <a href="#autodesign" data-view="autodesign">자동 설계</a>
      <a href="#sim" data-view="sim">시뮬레이션</a>
      <a href="#world" data-view="world">가상환경</a>
      <a href="#influence" data-view="influence">영향성</a>
      <a href="#autocode" data-view="autocode">Autocode</a>
      <a href="#verify" data-view="verify">검증</a>
      <!-- 열람 — 파이프라인의 단계가 아니라 아무 때나 여는 자리다.
           결과는 지금까지 낸 산출물 목록(계보 원장)이라 어느 단계에도 속하지 않는다. -->
      <a href="#results" data-view="results">결과</a>
    </nav>
    <span id="health" class="health">…</span>
  </header>
  <main id="view"></main>
