# Render Blueprint — 공개 데모 인스턴스 (README "공개 데모" 절 참조).
# 설치 절차의 원본은 scripts/setup.sh — 여기서는 배포에 필요한 최소만 재기술.
services:
  - type: web
    name: claw-demo
    runtime: python
    plan: free # 512MB RAM, 15분 유휴 시 슬립(콜드스타트 ~1분), 디스크 휘발
    autoDeploy: true # main push마다 자동 재배포
    # engine 먼저 — claw-engine은 PyPI 동명 패키지 회피로 server 의존성에서 의도적 누락.
    # editable(-e) 필수: 정적 웹 경로가 __file__ 기준 모노레포 web/ 을 가리킨다.
    # [dev] extra(pytest·httpx)는 배포에 불필요.
    # 지형 팩은 재생성 가능한 바이너리라 커밋하지 않는다(data/README.md) — 그래서 빌드마다
    # 공개 표고 타일에서 직접 굽는다. 실패해도(네트워크 등) echo로 exit 0 처리해 나머지
    # 배포는 그대로 진행한다 — 서버가 이미 "지형 없음"을 정상 처리하므로(routes/world.py)
    # 최악의 경우가 지금과 같다.
    # certifi를 따로 설치한다 — 처음 넣을 땐 httpx가 [dev] extra라 배포엔 안 깔려
    # certifi를 들여올 통로가 없어서였다(2026-09-02, 배포에서만 CA 번들을 못 찾아
    # 조용히 실패해 겪었다). 지금은 httpx가 런타임 의존이라(routes/llm.py 미션 초안)
    # server 설치로도 따라 들어오지만, 그 의존이 다시 내려가도 지형 굽기가 죽지 않게
    # 명시 설치를 남겨 둔다. scripts/terrain/build_terrain.py의 폴백 경로도 macOS/BSD
    # 경로라 Render 리눅스 빌드 이미지와는 맞지 않는다 — certifi가 그 폴백보다 먼저다.
    # server[db]: 계정 저장 외부 Postgres용 psycopg (users.py 머리말). extra라 폐쇄망
    # wheelhouse는 불변 — 이 데모만 깐다. CLAW_DB_URL이 비면 psycopg는 import되지 않는다.
    buildCommand: pip install --upgrade pip && pip install -e engine && pip install -e 'server[db]' && pip install certifi && (python3 scripts/terrain/build_terrain.py --origin-lat 34.601303 --origin-lon 127.212067 --tier core:radius=12000,step=30 --tier outer:radius=30000,step=90 --out data/geo/site-terrain-v1.bin > data/geo/.terrain-build.log 2>&1 || echo "지형 팩 생성 실패 — 로그는 data/geo/.terrain-build.log, 지형 없이 배포를 계속합니다")
    # --workers 1 명시 — uvicorn이 $WEB_CONCURRENCY로 워커를 늘리면 프로세스 메모리의
    # JobManager가 갈라져 진행률 조회가 조용히 404가 된다 (README 알려진 제약).
    startCommand: uvicorn --factory claw_server:create_app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health # Basic Auth 면제 경로와 일치 (auth.py)
    # LLM 백엔드 변수(CLAW_ANTHROPIC_API_KEY 또는 CLAW_LLM_* 계열)는 대시보드에서
    # 주입한다 — 커밋 금지. 이 데모는 Anthropic 쪽만 쓴다 (routes/llm.py 머리말).
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4 # devcontainer(3.13)와 맞춤 — 상한 핀 없는 의존성 조합 고정
      - key: CLAW_ACCESS_PASSWORD
        sync: false # 대시보드에서 입력 — 커밋 금지. 빈 값이면 무인증(공개). CLAW_ADMIN_PASSWORD가 있으면 무시된다(세션 모드가 우선 — auth.py)
      # ── 세션 모드 (로그인 화면·회원관리) — CLAW_ADMIN_PASSWORD를 넣는 순간 켜진다 ──
      - key: CLAW_ADMIN_USER
        sync: false # 시드 관리자 아이디 — 비우면 "admin"
      - key: CLAW_ADMIN_PASSWORD
        sync: false # 시드 관리자 비밀번호 — 비우면 세션 모드 꺼짐(위 Basic으로 폴백). 재기동마다 이 값으로 복원된다
      - key: CLAW_SESSION_SECRET
        sync: false # 쿠키 서명 시크릿(긴 무작위 문자열) — 비우면 부팅마다 랜덤이라 재배포·슬립 복귀마다 전원 로그아웃된다
      - key: CLAW_DB_URL
        sync: false # 계정 저장 Postgres URL(Neon/Supabase 등 아무 제공자, sslmode는 URL에) — 비우면 users.json인데 이 디스크는 휘발이라(위 plan 주석) 계정이 재배포마다 사라진다. 공개 데모는 반드시 채울 것
      - key: CLAW_ANTHROPIC_API_KEY
        # 이름만 선언한다(값은 대시보드) — 선언이 없으면 blueprint 동기화가 대시보드에서 넣은 값을
        # 어떻게 다루는지에 기대게 된다. 폐쇄망 CLAW_LLM_* 계열은 선언하지 않는다: CLAW_LLM_BASE_URL에
        # 값이 들어가는 순간 Anthropic으로 폴백 없이 로컬 백엔드로 고정되므로(routes/llm.py _backend —
        # 빈 값은 무시된다) 이 데모에 채울 자리를 만들어 두지 않는다
        sync: false # 대시보드에서 입력 — 커밋 금지. 비면 LLM 기능만 사유와 함께 꺼진다
      - key: CLAW_RESULT_LIMIT
        # 결과 크기는 미션 길이에 비례한다 — 기본 미션이 장주 착륙(320 s)이 되면서
        # 1건 ≈ 14MB(200 s) → ≈ 22MB로 늘었다. 상한 280MB를 유지하려고 건수를
        # 20 → 13으로 내린다. 건수를 그대로 두면 같은 디스크에서 440MB를 쓴다.
        value: "13"
      - key: CLAW_PROFILE_VOLATILE
        # 디스크가 휘발이라(위 plan 주석) 웹에서 저장한 기체가 재배포·슬립 복귀마다 사라진다.
        # 켜 두면 /api/health가 알리고 기체 탭이 그 사실을 한 줄로 말한다 — "저장했는데 없어졌다"가
        # 버그로 읽히지 않게. 예제 기체는 엔진 패키지 데이터라 무사하다 (06 §8)
        value: "1"
