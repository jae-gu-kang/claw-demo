<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>격자 체계 프로토타입</title>
<style>
  :root {
    --bg: #fbfbf9; --ink: #1d1d1b; --muted: #6b6b66; --line: #d9d8d2; --panel: #ffffff;
    --region: rgba(46, 110, 180, 0.13); --region-edge: #2e6eb4; --undef: #b58a1b;
    --model: #8d8d88; --bp-a: #1d1d1b; --bp-b: #b0412e;
    --ok: #2f8a4c; --caution: #c28a12; --fail: #c0392b; --na: #7a5ea8;
    --gap: #8d8d88; --calc: #d35400; --infeasible: #555; --notrun: #bbb;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header { padding: 14px 20px 6px; }
  h1 { font-size: 17px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12.5px; }
  main { padding: 0 20px 28px; display: grid; gap: 16px; max-width: 1180px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; margin-bottom: 8px; }
  .bar label { display: inline-flex; gap: 5px; align-items: center; }
  .seg button { border: 1px solid var(--line); background: #f3f2ee; padding: 3px 10px; cursor: pointer; }
  .seg button:first-child { border-radius: 5px 0 0 5px; }
  .seg button:last-child { border-radius: 0 5px 5px 0; }
  .seg button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  svg { width: 100%; height: auto; display: block; }
  .caption { color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 4px;
              vertical-align: -1px; }
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th, td { border: 1px solid var(--line); padding: 5px 6px; text-align: left; vertical-align: top; }
  th { background: #f3f2ee; font-weight: 600; white-space: nowrap; }
  td.cell { cursor: pointer; min-width: 92px; }
  td.cell:hover { outline: 2px solid var(--region-edge); outline-offset: -2px; }
  td.cell .h { font-weight: 600; }
  td.cell.h-fail { background: #fbe9e7; }
  td.cell.h-incomplete { background: repeating-linear-gradient(135deg, #fff, #fff 5px, #f1efe8 5px, #f1efe8 10px); }
  td.cell.h-ok { background: #edf6ef; }
  td.cell.h-na { background: #f1ecf8; }
  td.sel { outline: 2px solid var(--ink); outline-offset: -2px; }
  .checks li { margin: 2px 0; }
  .okmark { color: var(--ok); font-weight: 700; } .ngmark { color: var(--fail); font-weight: 700; }
  #detail table td:first-child { white-space: nowrap; }
  .scroll { overflow-x: auto; }
  .kinds { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 4px 0 8px; }
  .kind { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; display: grid;
          grid-template-columns: 22px 1fr; column-gap: 7px; align-items: start; cursor: pointer; user-select: none; }
  .kind.off { opacity: 0.42; }
  .kind svg { width: 20px; height: 20px; margin-top: 1px; }
  .kind b { font-size: 13px; }
  .kind .def { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.35; }
  .kind .cnt { grid-column: 2; font-size: 12px; margin-top: 3px; }
  @media (max-width: 760px) { .kinds { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  :root { --design: #1f4e8c; --trim: #8a8a84; }
</style>
</head>
<body>
<header>
  <h1>격자 체계 프로토타입</h1>
  <div class="sub">05 §11 · 06 §10 첫 구현 범위 — 실험 결과(<code>out/*.json</code>)를 그대로 읽는다. 게인은 샘플 표다.</div>
</header>
<main>
  <section class="card">
    <div class="bar">
      <span class="seg" id="acSeg"></span>
      <span>연료 <span class="seg" id="fuelSeg"></span></span>
      <span>보기 <span class="seg" id="viewSeg"></span></span>
    </div>
    <div class="bar">
      <span>시나리오 <span class="seg" id="modeSeg"></span></span>
    </div>
    <div class="kinds" id="kinds"></div>
    <svg id="mh" viewBox="0 0 900 420" role="img" aria-label="마하-고도 운용영역"></svg>
    <div class="legend" id="legend"></div>
    <div class="caption" id="caption"></div>
  </section>
  <section class="card">
    <div class="bar"><strong id="sumTitle">검증 결과 요약</strong><span class="sub" id="sumSub"></span>
      <label id="refBox" title="분석 참조선 — 판정은 바꾸지 않고 차이만 보인다(04 §1)">분석 참조선 PM
        <input id="refPm" type="number" step="1" style="width:56px" placeholder="없음">°</label></div>
    <div class="scroll"><table id="sum"></table></div>
    <div id="detail" class="caption"></div>
  </section>
  <section class="card">
    <strong>실험 확인 항목</strong>
    <ul class="checks" id="checks"></ul>
  </section>
</main>
<script>
const STATE = {
  computable: ["완료", "var(--ok)"], calc_failed: ["계산 실패", "var(--calc)"],
  constraint_hit: ["제약 도달·미수렴", "#8e44ad"],
  infeasible: ["물리적 불가", "var(--infeasible)"], model_gap: ["모델 부족", "var(--gap)"],
  undefined: ["요구 미정의", "var(--undef)"], out_of_region: ["요구영역 밖", "#ddd"],
  not_run: ["미계산", "var(--notrun)"],
};
const VERDICT = { "불합격": "var(--fail)", "합격·주의": "var(--caution)", "합격·권장 충족": "var(--ok)",
                  "판정 불가": "var(--na)" };
const CHECK_LABEL = {
  separation: "설계점·절점 분리", per_table: "표별 절점(합집합으로 구간)", validation_rows: "검증조건 생성(독립 조합)",
  no_omission: "누락 방지(상태 합 = 후보 수)", scheduled_gains: "스케줄 게인 사용(비트 일치)",
  reuse: "계산 재사용(새 좌표만 트림)",
};
const $ = (id) => document.getElementById(id);
const Q = new URLSearchParams(location.search);  // 주소로 시나리오를 고른다(공유·헤드리스 확인용)
const S = { ac: Q.get("ac") ?? "example", data: {}, fuel: null, sel: null, view: Q.get("view") ?? "all",
  mode: Q.get("mode") ?? "val", br: {} };
const REASON = { NONLINEAR_METRIC: ["지표 비선형", "#7d3c98"], VERDICT_CHANGE: ["판정 변화", "#c0392b"],
  TRIM_FAILURE_BOUNDARY: ["트림 실패 경계", "#8e5a2b"] };
async function loadBR(ac, axis) {
  const k = `${ac}|${axis}`;
  if (!S.br[k]) S.br[k] = await (await fetch(`../out/${ac}_base_refine${axis === "common" ? "_common_axis" : ""}.json`)).json();
  return S.br[k];
}
const near = (a, b) => Math.abs(a - b) < 1e-6;
const fmt = (x, d = 3) => Number(x).toFixed(d).replace(/\.?0+$/, "");

async function load(ac) {
  if (!S.data[ac]) S.data[ac] = await (await fetch(`../out/${ac}.json`)).json();
  return S.data[ac];
}

// 경계표 보간 — gridsys.Region.mach_bounds와 같은 규칙(행·층 선형, 표 밖은 null = 요구 미정의)
function machBounds(region, alt, fuel) {
  const b = region.boundary;
  if (!b || !Object.keys(b).length) return [region.mach[0], region.mach[1]];
  const layers = Object.keys(b).map(Number).sort((x, y) => x - y);
  if (fuel < layers[0] - 1e-9 || fuel > layers[layers.length - 1] + 1e-9) return null;
  const rowsOf = (f) => (b[Object.keys(b).find((k) => near(Number(k), f))]).slice().sort((p, q) => p[0] - q[0]);
  const at = (f) => {
    const rows = rowsOf(f), alts = rows.map((r) => r[0]);
    if (alt < alts[0] - 1e-9 || alt > alts[alts.length - 1] + 1e-9) return null;
    const lerp = (col) => { if (rows.length === 1) return rows[0][col];
      for (let i = 0; i < rows.length - 1; i++) {
        if (alt <= rows[i + 1][0] + 1e-9) { const t = (alt - rows[i][0]) / (rows[i + 1][0] - rows[i][0]);
          return rows[i][col] + t * (rows[i + 1][col] - rows[i][col]); } } return rows[rows.length - 1][col]; };
    return [lerp(1), lerp(2)];
  };
  // 층 값 그대로의 연료는 그 층만 — gridsys.Region.mach_bounds와 같은 규칙
  const on = layers.find((f) => Math.abs(fuel - f) <= 1e-9);
  if (on !== undefined) return at(on);
  // 층 사이: Python searchsorted(side="right") − 1을 [0, len−2]로 묶은 것과 같은 아래 층
  let j = layers.filter((f) => f <= fuel).length - 1;
  j = Math.min(Math.max(j, 0), layers.length - 2);
  const f0 = layers[j], f1 = layers[j + 1], b0 = at(f0), b1 = at(f1);
  if (!b0 || !b1) return null;
  const t = (fuel - f0) / (f1 - f0);
  return [b0[0] + t * (b1[0] - b0[0]), b0[1] + t * (b1[1] - b0[1])];
}

function el(tag, attrs = {}, text) {
  const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  return e;
}

// 점 종류 네 가지 — 각각 켜고 끈다. 정의는 05 §11.1 용어표를 따른다
const KINDS = {
  trim: { name: "트림 시도점", def: "트림(평형) 계산을 시도한 조건 — 성공·실패 모두. 같은 조건은 한 번만 계산해 설계·검증이 함께 쓴다" },
  design: { name: "설계점", def: "게인을 튜닝할 때 고려하는 비행조건(마하·고도·연료). 절점과 무관하게 늘고 준다. 검증점과 따로 지정하되 겹쳐도 된다" },
  bp: { name: "게인 분할점(절점)", def: "게인 표가 값을 갖는 마하 좌표. 비행조건이 아니라 축 위의 위치라 세로선으로 그린다" },
  val: { name: "검증점", def: "완성된 스케줄을 실제 표 평가 게인으로 확인하는 조건. 절점 위·구간 중간·경계에 둔다" },
};
const ON = { trim: true, design: true, bp: true, val: true };

function glyph(kind) {
  const g = { trim: '<path d="M4 10h12M10 4v12" stroke="#8a8a84" stroke-width="2"/>',
    design: '<rect x="5" y="5" width="10" height="10" transform="rotate(45 10 10)" fill="#1f4e8c"/>',
    bp: '<path d="M10 2v16" stroke="#1d1d1b" stroke-width="1.6"/><path d="M6 2h8l-4 5z" fill="#1d1d1b"/>',
    val: '<circle cx="10" cy="10" r="5.5" fill="#2f8a4c" stroke="#2f8a4c" stroke-width="2"/>' }[kind];
  return `<svg viewBox="0 0 20 20">${g}</svg>`;
}

function drawKinds(d) {
  const f = S.fuel, bps = new Set(Object.values(d.schedule.bp_sets).flatMap((s) => s.coords));
  const count = {
    trim: [d.trim_points.filter((t) => near(t.cond.fuel, f)).length, d.trim_points.length],
    attempts: d.trim_counts?.attempts,
    design: [d.design_points.filter((p) => near(p.fuel, f)).length, d.design_points.length],
    bp: [bps.size, bps.size],
    val: [d.records.filter((r) => near(r.cond.fuel, f)).length, d.records.length],
  };
  const shared = d.trim_points.filter((t) => t.used_by.length > 1).length;
  $("kinds").replaceChildren(...Object.entries(KINDS).map(([k, v]) => {
    const e = document.createElement("div"); e.className = `kind${ON[k] ? "" : " off"}`;
    const [here, all] = count[k];
    const extra = k === "trim" ? ` (고유 조건) · 계산 시도 ${count.attempts ?? "?"}회 · 설계·검증 공유 ${shared}` : k === "bp" ? ` · 표 ${Object.keys(d.schedule.refs).length}개가 참조` : "";
    e.innerHTML = `${glyph(k)}<b>${v.name}</b><div class="def">${v.def}</div>`
      + `<div class="cnt">${k === "bp" ? `합집합 ${all}개 (${Object.entries(d.schedule.bp_sets).map(([n, v]) => `${n} ${v.coords.length}`).join(" · ")}) · 연료 무관` : `이 연료 ${here} · 전체 ${all}`}${extra}</div>`;
    e.title = "눌러서 켜고 끄기"; e.onclick = () => { ON[k] = !ON[k]; render(); };
    return e;
  }));
}

function drawMH(d) {
  const svg = $("mh"); svg.replaceChildren();
  const W = 900, H = 420, L = 62, R = 18, T = 40, B = 44;
  const u = d.validation.union, pad = (u[u.length - 1] - u[0]) * 0.12;
  // 보기 — 전체(0부터) / 절점 구간 확대(요구영역 앞뒤 약간). 확대해도 좌표는 옮기지 않고 창만 좁힌다
  const mMin = S.view === "all" ? 0 : Math.max(0, Math.min(u[0], d.region.mach[0]) - pad);
  const mMax = (S.view === "all" ? Math.max(d.region.mach[1], u[u.length - 1]) * 1.25 : Math.max(u[u.length - 1], d.region.mach[1]) + pad);
  const aMin = 0, aMax = d.region.alt[1] * 1.12;
  const x = (m) => L + ((Math.min(Math.max(m, mMin - 0.02 * (mMax - mMin)), mMax + 0.02 * (mMax - mMin)) - mMin) / (mMax - mMin)) * (W - L - R);
  const y = (a) => H - B - ((a - aMin) / (aMax - aMin)) * (H - T - B);
  const clipId = "plotClip"; const defs = el("defs");
  const cp = el("clipPath", { id: clipId }); cp.append(el("rect", { x: L, y: T, width: W - L - R, height: H - B - T })); defs.append(cp);
  const hatch = (id, color) => { const p = el("pattern", { id, width: 8, height: 8, patternUnits: "userSpaceOnUse",
    patternTransform: "rotate(45)" }); p.append(el("line", { x1: 0, y1: 0, x2: 0, y2: 8, stroke: color, "stroke-width": 2 }));
    defs.append(p); };
  hatch("hModel", "#b9b9b3"); hatch("hUndef", "#e3c77a"); svg.append(defs);
  // 축
  svg.append(el("line", { x1: L, y1: H - B, x2: W - R, y2: H - B, stroke: "#999" }));
  svg.append(el("line", { x1: L, y1: T, x2: L, y2: H - B, stroke: "#999" }));
  for (let k = 0; k <= 10; k++) { const m = mMin + ((mMax - mMin) * k) / 10;
    svg.append(el("text", { x: x(m), y: H - B + 16, "text-anchor": "middle", "font-size": 11, fill: "#6b6b66" }, fmt(m, 3))); }
  for (let k = 0; k <= 5; k++) { const a = (aMax * k) / 5;
    svg.append(el("text", { x: L - 8, y: y(a) + 4, "text-anchor": "end", "font-size": 11, fill: "#6b6b66" }, Math.round(a))); }
  svg.append(el("text", { x: (L + W - R) / 2, y: H - 8, "text-anchor": "middle", "font-size": 12, fill: "#6b6b66" }, "마하"));
  svg.append(el("text", { x: 14, y: (T + H - B) / 2, "font-size": 12, fill: "#6b6b66",
    transform: `rotate(-90 14 ${(T + H - B) / 2})`, "text-anchor": "middle" }, "고도 [m]"));
  const plot = el("g", { "clip-path": `url(#${clipId})` }); svg.append(plot);
  // 모델 미지원 — 회색 빗금 (요구영역을 자르지 않고 겹쳐 보인다)
  const mm = d.model.mach[1];
  if (mm < mMax) { plot.append(el("rect", { x: x(mm), y: T, width: x(mMax) - x(mm), height: H - B - T, fill: "url(#hModel)" }));
    svg.append(el("text", { x: x(mm) + 6, y: T + 14, "font-size": 11, fill: "#6b6b66" }, "모델 미지원")); }
  // 요구영역 — 이 연료에서 경계표 보간, 표가 덮지 않는 고도는 요구 미정의 무늬
  const f = S.fuel, alts = [];
  for (let k = 0; k <= 60; k++) alts.push(d.region.alt[0] + ((d.region.alt[1] - d.region.alt[0]) * k) / 60);
  const def = alts.map((a) => [a, machBounds(d.region, a, f)]).filter(([, b]) => b);
  if (def.length) {
    const pts = [...def.map(([a, b]) => `${x(b[0])},${y(a)}`), ...def.slice().reverse().map(([a, b]) => `${x(b[1])},${y(a)}`)];
    plot.append(el("polygon", { points: pts.join(" "), fill: "var(--region)", stroke: "var(--region-edge)", "stroke-width": 1.5 }));
    const aTop = def[def.length - 1][0];
    if (aTop < d.region.alt[1] - 1e-6)
      plot.append(el("rect", { x: x(d.region.mach[0]), y: y(d.region.alt[1]), width: x(d.region.mach[1]) - x(d.region.mach[0]),
        height: y(aTop) - y(d.region.alt[1]), fill: "url(#hUndef)", stroke: "var(--undef)", "stroke-dasharray": "4 3" }));
  }
  // 게인 분할점(절점) — 세로선 + 위쪽 ▼ 표식과 값. 비행조건이 아니다. 절점 집합마다 다른 선
  const bpLegend = [];
  const sets = d.schedule.bp_sets, sharing = d.schedule.sharing, refs = d.schedule.refs;
  Object.entries(sets).forEach(([name, s], i) => {
    const users = Object.keys(refs).filter((g) => refs[g] === name);
    const indep = users.every((g) => sharing[g] === "independent");
    const col = i ? "var(--bp-b)" : "var(--bp-a)";
    bpLegend.push([name, col, indep ? `독립: ${users.join(", ")}` : `공유 ${users.length}표`, indep]);
    if (!ON.bp) return;
    s.coords.forEach((m) => {
      plot.append(el("line", { x1: x(m), y1: T, x2: x(m), y2: H - B, stroke: col, "stroke-width": 1.2,
        "stroke-dasharray": indep ? "5 4" : "none", opacity: 0.6 }));
      const ty = i ? T - 4 : T - 16;
      svg.append(el("path", { d: `M${x(m) - 4} ${ty + 2}h8l-4 5z`, fill: col }));
      svg.append(el("text", { x: x(m) + 6, y: ty + 7, "font-size": 10, fill: col }, `${name}:${fmt(m, 3)}`));
    });
  });
  // 트림점 — 회색 +. 계산 상태를 툴팁에
  if (ON.trim) d.trim_points.filter((t) => near(t.cond.fuel, f)).forEach((t) => {
    const g = el("path", { d: `M${x(t.cond.mach) - 6} ${y(t.cond.alt)}h12M${x(t.cond.mach)} ${y(t.cond.alt) - 6}v12`,
      stroke: "var(--trim)", "stroke-width": 1.6 });
    g.append(el("title", {}, `트림 시도점 ${t.name}\n${STATE[t.state][0]}${t.reasons.length ? " · " + t.reasons.join(", ") : ""}\n쓰는 곳: ${t.used_by.map((u) => u === "design" ? "설계점" : "검증점").join(", ")}`));
    plot.append(g);
  });
  // 설계점 — 채운 남색 마름모 (검증점 원보다 크게 — 같은 조건이면 원 뒤로 테두리가 보인다)
  if (ON.design) d.design_points.filter((p) => near(p.fuel, f)).forEach((p) => {
    const g = el("rect", { x: x(p.mach) - 5.5, y: y(p.alt) - 5.5, width: 11, height: 11, fill: "var(--design)",
      transform: `rotate(45 ${x(p.mach)} ${y(p.alt)})`, opacity: 0.85 });
    g.append(el("title", {}, `설계점 M${fmt(p.mach, 4)} · ${p.alt} m · ${fmt(p.fuel, 1)} kg\n출처: ${p.origin}`));
    plot.append(g);
  });
  // 검증점 — 원, 색 = 계산 상태(완료면 판정 색). 구간 중간은 큰 원, 절점 위는 작은 원, 경계·clip은 점선 테두리
  if (ON.val) d.records.filter((r) => near(r.cond.fuel, f)).forEach((r) => {
    const c = r.state === "computable" ? VERDICT[r.verdict] : STATE[r.state][1];
    const g = el("circle", { cx: x(r.cond.mach), cy: y(r.cond.alt), r: r.kind === "midpoint" ? 4.5 : 3.2,
      fill: r.state === "computable" ? c : "#fff", stroke: c, "stroke-width": 2,
      "stroke-dasharray": r.kind === "boundary" || r.kind === "clip" ? "2 1.5" : "none" });
    const kindKo = { breakpoint: "절점 위", midpoint: "구간 중간", clip: "clip 구간", boundary: "요구영역 경계", extra: "추가" }[r.kind];
    g.append(el("title", {}, `검증점 ${r.name}\n${kindKo} · ${STATE[r.state][0]}${r.verdict ? " · " + r.verdict : ""}${r.reasons.length ? "\n사유: " + r.reasons.join(", ") : ""}`));
    plot.append(g);
  });
  $("caption").textContent = `연료 ${fmt(f, 1)} kg · 실험 영역 마하 ${fmt(d.region.mach[0])}–${fmt(d.region.mach[1])}(기존 게인 스케줄 범위에 맞춘 실험 설정 — 요구 운용영역의 정의가 아니다), `
    + `고도 ${d.region.alt[0]}–${d.region.alt[1]} m · 모델 마하 ${d.model.mach[0]}–${d.model.mach[1]} · 기준 ${d.criteria_source}`
    + ` · 코드 ${d.code} · 점에 마우스를 올리면 조건과 사유`;
  const span = (html) => { const e = document.createElement("span"); e.innerHTML = html; return e; };
  $("legend").replaceChildren(
    span("<b>검증점 색</b>"),
    ...Object.entries(VERDICT).map(([k, c]) => span(`<i style="background:${c};border:2px solid ${c}"></i>${k}`)),
    ...["infeasible", "constraint_hit", "calc_failed", "model_gap", "undefined"].map((st) =>
      span(`<i style="background:#fff;border:2px solid ${STATE[st][1]}"></i>${STATE[st][0]}`)),
    span("<b>검증점 모양</b> 큰 원 = 구간 중간 · 작은 원 = 절점 위 · 점선 = 경계·clip"),
    ...bpLegend.map(([n, c, txt, indep]) => span(`<span style="color:${c}">${indep ? "┆" : "│"}</span> 절점 ${n} (${txt})`)));
}

function drawBase(d, br) {
  // 캔버스는 검증 실험과 같은 틀(요구영역·빗금·축)을 쓰고, 점만 기본 격자 시나리오 것으로 바꾼다
  const keep = { ...ON };
  Object.assign(ON, { trim: false, design: false, bp: false, val: false });
  drawMH(d);
  Object.assign(ON, keep);
  const svg = $("mh"), plot = svg.querySelector("g[clip-path]");
  const W = 900, H = 420, L = 62, R = 18, T = 40, B = 44;
  const u = br.bps, pad = (u[u.length - 1] - u[0]) * 0.12;
  const mMin = S.view === "all" ? 0 : Math.max(0, Math.min(u[0], d.region.mach[0]) - pad);
  const mMax = S.view === "all" ? Math.max(d.region.mach[1], u[u.length - 1]) * 1.25 : Math.max(u[u.length - 1], d.region.mach[1]) + pad;
  const aMax = d.region.alt[1] * 1.12;
  const x = (m) => L + ((m - mMin) / (mMax - mMin)) * (W - L - R), y = (a) => H - B - (a / aMax) * (H - T - B);
  const f = S.fuel;
  if (ON.bp) u.forEach((m) => {
    plot.append(el("line", { x1: x(m), y1: T, x2: x(m), y2: H - B, stroke: "var(--bp-a)", "stroke-width": 1.2, opacity: 0.6 }));
    svg.append(el("path", { d: `M${x(m) - 4} ${T - 14}h8l-4 5z`, fill: "var(--bp-a)" }));
    svg.append(el("text", { x: x(m) + 6, y: T - 7, "font-size": 10, fill: "var(--bp-a)" }, fmt(m, 3)));
  });
  if (ON.trim) br.base.filter((b) => near(b.fuel, f)).forEach((b) => {
    const ok = b.state === "computable";
    const e = el("circle", { cx: x(b.mach), cy: y(b.alt), r: 2.6, fill: ok ? "#8a8a84" : "#fff", stroke: "#8a8a84", "stroke-width": 1.2 });
    e.append(el("title", {}, `기본 격자 M${fmt(b.mach, 4)} · ${b.alt} m\n${STATE[b.state][0]}`)); plot.append(e);
  });
  if (ON.val) br.validation.filter((v) => near(v.fuel, f)).forEach((v) => {
    const c = v.state === "computable" ? VERDICT[v.verdict] : STATE[v.state][1];
    if (v.trim_origin === "new") plot.append(el("circle", { cx: x(v.mach), cy: y(v.alt), r: 8, fill: "none", stroke: "#1d1d1b", "stroke-width": 1.4 }));
    const e = el("circle", { cx: x(v.mach), cy: y(v.alt), r: 4.5, fill: v.state === "computable" ? c : "#fff", stroke: c, "stroke-width": 2 });
    e.append(el("title", {}, `검증점 M${fmt(v.mach, 4)} · ${v.alt} m\n${STATE[v.state][0]}${v.verdict ? " · " + v.verdict : ""}\n트림: ${{ base: "기본 격자에서 재사용", new: "새로 트림(기본 격자에 없음)", none: "트림 없음" }[v.trim_origin]}`));
    plot.append(e);
  });
  if (ON.design) br.added.filter((a) => near(a.fuel, f)).forEach((a) => {
    const [name, col] = REASON[a.reason] ?? [a.reason, "#555"];
    const e = el("path", { d: `M${x(a.mach)} ${y(a.alt) - 6}l5.5 9.5h-11z`, fill: col, opacity: 0.9 });
    e.append(el("title", {}, `보강 추가점 M${fmt(a.mach, 4)} · ${a.alt} m\n사유: ${name}${a.slot ? " (" + a.slot + ")" : ""}`));
    plot.append(e);
  });
  const m = br.metrics, span = (h) => { const e = document.createElement("span"); e.innerHTML = h; return e; };
  const cnt = (arr) => arr.filter((z) => near(z.fuel, f)).length;
  const reasons = Object.entries(m.refinement_reasons).map(([k, n]) => `<span style="color:${REASON[k]?.[1]}">▲</span> ${REASON[k]?.[0] ?? k} ${n}`).join(" · ");
  const card = (k, glyphHtml, name, def, cntHtml) => { const e = document.createElement("div"); e.className = `kind${ON[k] ? "" : " off"}`;
    e.innerHTML = `<svg viewBox="0 0 20 20">${glyphHtml}</svg><b>${name}</b><div class="def">${def}</div><div class="cnt">${cntHtml}</div>`;
    e.onclick = () => { ON[k] = !ON[k]; render(); }; return e; };
  $("kinds").replaceChildren(
    card("trim", '<circle cx="10" cy="10" r="4" fill="#8a8a84"/>', "기본 모델 격자", "먼저 트림·선형화해 두는 점. 채운 점 = 계산 완료, 빈 점 = 실패",
      `이 연료 ${cnt(br.base)} · 전체 ${m.base_points} · 설계점(계산 완료) ${m.design_points} · 조밀화 필요 쌍 ${m.quality_dense_pairs} · 국소 이상 ${m.quality_anomalies}`),
    card("bp", '<path d="M10 2v16" stroke="#1d1d1b" stroke-width="1.6"/><path d="M6 2h8l-4 5z" fill="#1d1d1b"/>', "게인 분할점(절점)", "기본 격자 마하에서 한 칸 건너 고른 좌표", `${u.length}개`),
    card("val", '<circle cx="10" cy="10" r="4.5" fill="#2f8a4c"/><circle cx="10" cy="10" r="8" fill="none" stroke="#1d1d1b" stroke-width="1.4"/>', "검증점",
      "단일 원 = 기본 격자에서 골라 재사용, 이중 원 = 기본 격자에 없어 새로 트림",
      `이 연료 ${cnt(br.validation)} · 재사용 ${m.role_reused} · 새 트림 ${m.role_new_trims} · <b>재사용률 ${fmt(m.base_reuse_ratio, 2)}</b>`),
    card("design", '<path d="M10 3l6 11H4z" fill="#7d3c98"/>', "보강 추가점", "왜 더했는지 사유별 색", `${reasons} · 보강 새 트림 ${m.refine_new_trims} · ${m.reinforce_status}${m.reinforce_unmeasured ? ` (잴 수 없는 구간 ${m.reinforce_unmeasured})` : ""}`));
  $("legend").replaceChildren(span("<b>검증점 색</b> = 판정(계산 완료) 또는 계산 상태"),
    ...Object.entries(REASON).map(([k, [n, c]]) => span(`<span style="color:${c}">▲</span> ${n}`)));
}

function drawBaseMetrics(br) {
  const m = br.metrics;
  $("sumTitle").textContent = "기본 격자 + 보강 지표";
  $("sumSub").textContent = " 추가 트림 = 역할 요청(검증점) + 보강 · 실패는 추가 트림 중 계산 불가";
  $("refBox").style.display = "none";
  const rows = [
    ["기본 격자 점 / 트림", `${m.base_points} / ${m.base_trims}`], ["기본 격자 재사용률", fmt(m.base_reuse_ratio, 2)],
    ["검증 요청 — 재사용 / 새 트림", `${m.role_reused} / ${m.role_new_trims}`], ["보강 새 트림", m.refine_new_trims],
    ["추가 트림 합 (실패)", `${m.additional_trims} (${m.additional_trim_failures})`],
    ["설계점 / 검증점", `${m.design_points} / ${m.validation_points}`],
    ["검증점 게인 출처 — 절점 위 / 보간 / clip", `${m.interpolation.breakpoint} / ${m.interpolation.interpolated} / ${m.interpolation.clip}`],
    ["보강 사유", Object.entries(m.refinement_reasons).map(([k, n]) => `${REASON[k]?.[0] ?? k} ${n}`).join(" · ")],
    ["보강 종료", `${m.reinforce_status}${m.reinforce_unmeasured ? ` — 잴 수 없는 구간 ${m.reinforce_unmeasured}` : ""}`],
    ["트림 품질 — 조밀화 필요 쌍 / 국소 이상 / 판단 불가 행", `${m.quality_dense_pairs} / ${m.quality_anomalies} / ${m.quality_unjudged_rows ?? 0}`],
    ["고유 조건 / 계산 시도", `${m.unique_conditions} / ${m.attempts}`],
  ];
  $("sum").innerHTML = rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join("");
  $("detail").textContent = "";
}

function drawSummary(d) {
  const t = $("sum"), cols = d.summary.columns, u = d.validation.union;
  const colLabel = (c) => c === "clip<" ? "clip 하한" : c === "clip>" ? "clip 상한"
    : c.startsWith("bp") ? `절점 ${fmt(u[+c.slice(2) - 1])}` : `구간 ${c.slice(2)}`;
  const rows = [...d.validation.fuels.flatMap((f) => d.validation.alts.map((a) => [a, f])), "경계·추가"];
  const key = (r) => Array.isArray(r) ? `${r[0]}|${r[1]}` : r;
  const cells = new Map(d.summary.cells.map((c) => [`${key(c.row)}@${c.col}`, c]));
  const head = `<tr><th>고도 · 연료</th>${cols.map((c) => `<th>${colLabel(c)}</th>`).join("")}</tr>`;
  const body = rows.map((r) => `<tr><th>${Array.isArray(r) ? `${r[0]} m · ${fmt(r[1], 1)} kg` : r}</th>${cols.map((c) => {
    const x = cells.get(`${key(r)}@${c}`);
    if (!x) return "<td></td>";
    const cls = { "불합격": "h-fail", "미완료": "h-incomplete", "판정 불가 포함": "h-na" }[x.headline] ?? "h-ok";
    return `<td class="cell ${cls}" data-k="${key(r)}@${c}"><div class="h">${x.headline}</div>${x.text}</td>`;
  }).join("")}</tr>`).join("");
  t.innerHTML = head + body;
  $("sumSub").textContent = ` 열 = clip·절점·구간 교대(절점은 평가 대상 표들의 합집합) · 분모는 요청 점 전부 · `
    + `요구영역 밖 ${d.summary.out_of_region}점은 분모에서 빼고 여기 적는다 · 조합 방식: ${d.validation.mode === "full" ? "전체" : "대표"}`;
  t.querySelectorAll("td.cell").forEach((td) => td.onclick = () => {
    t.querySelectorAll("td.sel").forEach((x) => x.classList.remove("sel")); td.classList.add("sel");
    const [rk, col] = td.dataset.k.split("@");
    const pts = d.records.filter((r) => (r.row ? `${r.row[0]}|${r.row[1]}` : "경계·추가") === rk
      && colOf(r.cond.mach, u) === col && r.state !== "out_of_region");
    $("detail").innerHTML = `<table><tr><th>조건</th><th>종류</th><th>계산 상태</th><th>판정</th><th>최악 자리</th><th>사유</th></tr>${
      pts.map((r) => `<tr><td>M ${fmt(r.cond.mach, 4)} · ${r.cond.alt} m · ${fmt(r.cond.fuel, 1)} kg</td><td>${r.kind}</td>`
        + `<td>${STATE[r.state][0]}</td><td>${r.verdict ?? "—"}</td><td>${worst(r)}</td><td>${r.reasons.join(", ") || "—"}</td></tr>`).join("")}</table>`;
  });
}

function colOf(m, u) {
  if (m < u[0] - 1e-9) return "clip<"; if (m > u[u.length - 1] + 1e-9) return "clip>";
  const i = u.findIndex((x) => near(x, m)); if (i >= 0) return `bp${i + 1}`;
  const j = u.findIndex((x) => x > m) - 1; return `iv${j + 1}-${j + 2}`;
}
function worst(r) {
  if (!r.slots) return "—";
  const rank = { "불합격": 3, "판정 불가": 2, "합격·주의": 1, "합격·권장 충족": 0 };
  const [slot, s] = Object.entries(r.slots).sort((a, b) => rank[b[1].verdict] - rank[a[1].verdict])[0];
  // 대표 지표와 루프 마진을 함께 — 합격선 아래 값에 ✗ (불합격 원인이 대표 지표가 아닐 수 있다)
  const pl = S.data[S.ac].pass_lines ?? {}, parts = [];
  if (s.metric != null) parts.push(`지표 ${fmt(s.metric, 3)}`);
  const mark = (v, line) => (line != null && v < line ? " ✗" : "");
  const ref = parseFloat($("refPm").value);
  if (s.pm_deg != null && Number.isFinite(s.pm_deg)) parts.push(`PM ${fmt(s.pm_deg, 1)}°${mark(s.pm_deg, pl.pm_deg)}`
    + (Number.isFinite(ref) ? ` (참조선 ${fmt(ref, 1)}°보다 ${s.pm_deg - ref >= 0 ? "+" : ""}${fmt(s.pm_deg - ref, 1)}°)` : ""));
  if (s.gm_db != null && Number.isFinite(s.gm_db)) parts.push(`GM ${fmt(s.gm_db, 2)} dB${mark(s.gm_db, pl.gm_db)}`);
  return `${slot} ${s.verdict}${parts.length ? ` — ${parts.join(" · ")}` : ""}`;
}

function drawChecks(d) {
  $("checks").innerHTML = Object.entries(d.checks).map(([k, v]) => {
    const { ok, ...rest } = v;
    return `<li><span class="${ok ? "okmark" : "ngmark"}">${ok ? "통과" : "실패"}</span> ${CHECK_LABEL[k] ?? k} — `
      + `<code>${JSON.stringify(rest)}</code></li>`;
  }).join("");
}

function seg(host, items, cur, on) {
  host.replaceChildren(...items.map(([v, label]) => { const b = document.createElement("button");
    b.textContent = label; b.className = v === cur ? "on" : ""; b.onclick = () => on(v); return b; }));
}

async function render() {
  const d = await load(S.ac);
  if (S.fuel == null || !d.validation.fuels.some((f) => near(f, S.fuel))) S.fuel = d.validation.fuels[0];
  seg($("acSeg"), [["example", "예제 기체"], ["showcase", "쇼케이스 기체"]], S.ac, (v) => { S.ac = v; S.fuel = null; render(); });
  seg($("viewSeg"), [["all", "전체"], ["bp", "절점 구간 확대"]], S.view, (v) => { S.view = v; render(); });
  seg($("fuelSeg"), d.validation.fuels.map((f) => [f, `${fmt(f, 1)} kg`]), S.fuel, (v) => { S.fuel = v; render(); });
  seg($("modeSeg"), [["val", "검증 실험"], ["row", "기본 격자 + 보강 (행별 축)"], ["common", "기본 격자 + 보강 (공통 축)"]],
    S.mode, (v) => { S.mode = v; render(); });
  if (S.mode === "val") {
    $("sumTitle").textContent = "검증 결과 요약"; $("refBox").style.display = "";
    drawKinds(d); drawMH(d); drawSummary(d); drawChecks(d);
  } else {
    const br = await loadBR(S.ac, S.mode);
    drawBase(d, br); drawBaseMetrics(br); drawChecks(d);
  }
}
$("refPm").oninput = () => document.querySelector("#sum td.sel")?.click();
if (Q.get("refpm")) $("refPm").value = Q.get("refpm");
render().then(() => {  // ?pick=fail — 첫 불합격 칸을 연다(공유 링크·헤드리스 확인용)
  if (Q.get("pick") === "fail") [...document.querySelectorAll("#sum td.cell")].find((t) => t.textContent.startsWith("불합격"))?.click();
}).catch((e) => { document.body.insertAdjacentHTML("afterbegin", `<pre style="color:#c0392b">${e}</pre>`); });
</script>
</body>
</html>
