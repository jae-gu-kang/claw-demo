[project]
name = "claw-server"
version = "0.1.0"
description = "CLAW 설계툴 M13 백엔드 — FastAPI REST·웹소켓 진행률 (엔진 API 소비자, 도메인 로직 없음)"
requires-python = ">=3.10"
# claw-engine(로컬 모노레포 패키지)은 의도적으로 미기재 — 동명 PyPI 패키지 오설치 방지.
# 설치 순서: pip install -e engine && pip install -e server (README 참조)
# uvicorn은 [standard] 필수 — plain uvicorn의 Requires-Dist는 click·h11뿐이고
# websockets는 extra == 'standard'에만 걸려 있다. plain으로 깔면 WS /api/ws/jobs/{id}
# 업그레이드가 "Unsupported upgrade request"로 거절되어 진행률이 폴링으로 degrade한다
# (web/js/api.js의 onclose 폴백 때문에 UI는 살아 있어 발견이 늦다).
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # routes/llm.py(LLM 프록시 — Anthropic 또는 사내 OpenAI 호환 서버 호출)의
    # 유일한 아웃바운드 클라이언트. 벤더 SDK 대신 httpx 직접 호출인 이유: 의존
    # 최소·폐쇄망 wheelhouse 부담 최소 — 로컬 백엔드도 HTTP라 새 패키지가 없다
    # (백엔드 미설정이면 기능만 꺼지고 httpx는 import되지 않는다).
    "httpx>=0.27",
]

[project.optional-dependencies]
# dev의 httpx는 TestClient용 — 런타임 항목과 하한을 같게 유지할 것 (갈리면 두 뜻이 된다)
dev = ["pytest>=7", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["claw_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
