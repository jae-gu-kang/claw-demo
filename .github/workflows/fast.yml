# 빠른 층 — push·PR마다 도는 가드. **3~4초**에 끝난다.
#
# 이 리포는 가드를 많이 만들어 뒀는데 그것을 돌리는 것을 강제하는 장치가 없었다.
# 가드는 돌려야 가드다. 먼저 싼 것부터 자동으로 돌린다.
#
# ## 왜 설치 단계가 없나
#
# 두 스위트 모두 **node 내장 러너**를 쓰고 npm 의존이 0이다(web/package.json
# "의존 0", web/world는 테스트가 자기 src만 들여온다). 참조 검사기는 파이썬
# stdlib만 쓴다. 그래서 checkout + node 설정이 전부이고, 이 층이 싼 이유가 그것이다.
#
# ## 이 층이 **덮지 않는 것** — 초록을 과대해석하지 말 것
#
# 느려서 야간·태그로 미룬 것들이다 (README 「테스트」가 손으로 돌리는 법을 적어 둔다):
#
#   - engine  pytest  — 1,124건 · 약 24분 (트림·선형화·IR·MC/DC 계측)
#   - server  pytest  —   295건 · 약 28분 (API 경유로 실제 시뮬·설계 루프를 돈다)
#   - flight  pytest  —    33건 · 약 1분  (생성 C를 컴파일해 파이썬 IR과 비트 대조)
#   - web/world/build/world.js 가 src와 맞는지 — 재빌드에 npm ci + vite가 든다
#
# 즉 **여기가 초록이라고 탑재 C가 검증된 것이 아니다.** 그 판정은 느린 층의 몫이다.
name: fast

on:
  push:
  pull_request:

# 같은 브랜치에 연달아 밀면 앞선 실행은 접는다 — 3초짜리라도 줄은 짧을수록 낫다
concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      # 액션은 **v5**다. v4는 러너의 Node 20에 맞춰 만들어졌는데 그 런타임이 내려가서
      # GitHub이 Node 24로 강제 실행하며 매 실행 경고를 남겼다 — 지금은 경고지만 강제
      # 실행이 끝나면 실패다. v5는 Node 24가 정본이라 그 경고가 사라진다. 아래
      # node-version "22"는 이것과 **무관한 축**이다(러너가 아니라 테스트가 쓸 node).
      - uses: actions/checkout@v5

      # 22로 **고정한다**. web/world 스위트가 `.ts`를 변환 없이 그대로 돌리는데
      # (node --test "src/**/*.test.ts") 그 타입 스트리핑이 22.6+ 기능이라 하한이
      # 있다. devcontainer는 "lts"라 움직이는 값이므로, 그쪽이 올라가면 여기서
      # 먼저 돌려 보고 같이 올릴 것 — 검증한 것만 핀한다 (실측 22.22.2).
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 세 단계를 **끝까지 돌린다**. 첫 실패에서 멈추면 한 번에 하나씩만 알게 되고,
      # 3초짜리 층에서 그 왕복은 순전한 낭비다. 실패한 단계가 있으면 잡은 그대로 빨갛다.
      - name: 웹 — node 내장 러너
        if: ${{ !cancelled() }}
        working-directory: web
        run: node --test "js/**/*.test.js"

      # 위 글로브가 못 닿는 별도 스위트다 (web/world는 자기 tsconfig·소스 트리를 갖는다)
      - name: 가상환경 — node 내장 러너
        if: ${{ !cancelled() }}
        working-directory: web/world
        run: node --test "src/**/*.test.ts"

      # 본문 정본은 docs/README.md 「검사기」 절이고 이 래퍼가 거기서 추출해 돌린다 —
      # 복사본을 두지 않는 이유와 추출 실패를 통과로 위장하지 않는 장치는 그 스크립트에 있다
      - name: 문서 참조 검사기
        if: ${{ !cancelled() }}
        run: bash scripts/refcheck.sh
